services:
  web:
    build:
      context: .
      args:
        # El navegador corre en tu computador, por eso el backend se llama por localhost
        - VITE_API_BASE_URL=http://localhost:8080/api
        - VITE_USE_MOCK=false
    ports:
      - '5173:4173'
    depends_on:
      - backend
  backend:
    # Imagen del backend de los labs 3 y 4. Se define en .env como BACKEND_IMAGE.
    image: ${BACKEND_IMAGE:-blueprints-backend:latest}
    pull_policy: never
    ports:
      - '8080:8080'
